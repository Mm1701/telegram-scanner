<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>CloudMES Scanner</title>

    <script src="https://telegram.org/js/telegram-web-app.js?63"></script>

    <script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            color: white;

            font-family:
                Arial,
                sans-serif;

        }


        body {

            display: flex;

            flex-direction: column;

            overflow: hidden;

        }


        .header {

            padding:
                calc(12px + env(safe-area-inset-top))
                16px
                12px;

            text-align: center;

            font-size: 20px;

            font-weight: bold;

        }


        .sub {

            text-align: center;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 10px;

        }


        .scanner {

            position: relative;

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background: #000;

        }


        video {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .scan-frame {

            position: absolute;

            width: 72vw;

            max-width: 320px;

            height: 72vw;

            max-height: 320px;

            border: 3px solid #00ff88;

            border-radius: 20px;

            box-shadow:
                0 0 0 9999px
                rgba(0, 0, 0, 0.45);

            pointer-events: none;

        }


        .scan-line {

            position: absolute;

            left: 8px;

            right: 8px;

            top: 10%;

            height: 2px;

            background: #00ff88;

            box-shadow:
                0 0 10px #00ff88;

            animation:
                scan 2s infinite;

        }


        @keyframes scan {

            0% {
                top: 10%;
            }

            50% {
                top: 88%;
            }

            100% {
                top: 10%;
            }

        }


        .status {

            padding: 14px;

            text-align: center;

            background: #181818;

            font-size: 14px;

        }


        .result {

            display: none;

            padding: 16px;

            background: #181818;

        }


        .result-title {

            color: #00ff88;

            font-weight: bold;

            margin-bottom: 8px;

        }


        .result-value {

            word-break: break-all;

            background: #252525;

            border-radius: 10px;

            padding: 12px;

            font-size: 15px;

        }


        button {

            margin-top: 12px;

            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 10px;

            font-size: 15px;

            font-weight: bold;

            background: #00a86b;

            color: white;

        }


        .error {

            color: #ff6b6b;

        }

    </style>

</head>


<body>


    <div class="header">

        📷 CloudMES Scanner

    </div>


    <div class="sub">

        QR Code / Data Matrix

    </div>


    <div
        id="scanner"
        class="scanner"
    >

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>


        <div class="scan-frame">

            <div class="scan-line"></div>

        </div>

    </div>


    <div
        id="status"
        class="status"
    >

        🔍 Đang khởi động camera...

    </div>


    <div
        id="result"
        class="result"
    >

        <div class="result-title">

            ✅ Đã quét được

        </div>


        <div
            id="resultValue"
            class="result-value"
        ></div>


        <button
            id="rescan"
        >

            🔄 Quét lại

        </button>

    </div>


<script>

"use strict";


const tg =
    window.Telegram.WebApp;


tg.ready();

tg.expand();


const video =
    document.getElementById(
        "video"
    );


const statusEl =
    document.getElementById(
        "status"
    );


const resultEl =
    document.getElementById(
        "result"
    );


const resultValueEl =
    document.getElementById(
        "resultValue"
    );


const scannerEl =
    document.getElementById(
        "scanner"
    );


const rescanBtn =
    document.getElementById(
        "rescan"
    );


let codeReader =
    null;


let controls =
    null;


let scanning =
    false;


let sent =
    false;



function setStatus(
    text,
    error = false
) {

    statusEl.textContent =
        text;

    statusEl.classList.toggle(
        "error",
        error
    );

}



async function startScanner() {

    sent =
        false;


    resultEl.style.display =
        "none";


    scannerEl.style.display =
        "flex";


    setStatus(
        "🔍 Đang mở camera..."
    );


    try {

        codeReader =
            new ZXingBrowser.BrowserMultiFormatReader();


        const devices =
            await ZXingBrowser.BrowserCodeReader
                .listVideoInputDevices();


        if (
            !devices ||
            devices.length === 0
        ) {

            throw new Error(
                "Không tìm thấy camera"
            );

        }


        let deviceId =
            devices[0].deviceId;


        const backCamera =
            devices.find(
                device => {

                    const label =
                        (
                            device.label ||
                            ""
                        ).toLowerCase();


                    return (
                        label.includes("back") ||
                        label.includes("rear") ||
                        label.includes("environment")
                    );

                }
            );


        if (backCamera) {

            deviceId =
                backCamera.deviceId;

        }


        setStatus(
            "🔍 Đưa QR / Data Matrix vào khung..."
        );


        controls =
            await codeReader.decodeFromVideoDevice(

                deviceId,

                video,

                (
                    result,
                    error
                ) => {

                    if (
                        result &&
                        !sent
                    ) {

                        handleScan(
                            result.getText()
                        );

                    }

                }

            );


        scanning =
            true;

    }
    catch (error) {

        console.error(
            error
        );


        setStatus(
            "❌ Không mở được camera: " +
            (
                error.message ||
                error
            ),
            true
        );

    }

}



function handleScan(
    value
) {

    if (
        sent ||
        !value
    ) {

        return;

    }


    sent =
        true;


    value =
        String(value).trim();


    setStatus(
        "✅ Đã quét: " +
        value
    );


    resultValueEl.textContent =
        value;


    scannerEl.style.display =
        "none";


    resultEl.style.display =
        "block";


    if (controls) {

        try {

            controls.stop();

        }
        catch (e) {

            console.warn(e);

        }

    }


    /*
     * Gửi mã về Telegram Bot
     */

    tg.sendData(
        JSON.stringify({

            type:
                "scan",

            value:
                value

        })
    );


    /*
     * Cho Telegram đóng Mini App
     */

    setTimeout(
        () => {

            try {

                tg.close();

            }
            catch (e) {}

        },
        300
    );

}



rescanBtn.addEventListener(
    "click",
    () => {

        if (controls) {

            try {

                controls.stop();

            }
            catch (e) {}

        }


        startScanner();

    }
);


startScanner();

</script>


</body>

</html>
