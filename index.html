```html
<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>CloudMES Scanner</title>


    <!-- =====================================================
         TELEGRAM WEB APP
    ====================================================== -->

    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <!-- =====================================================
         ZXING
         QR CODE + DATA MATRIX
    ====================================================== -->

    <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #111;

            color: white;

            font-family:
                Arial,
                sans-serif;

        }


        body {

            display: flex;

            flex-direction: column;

            overflow: hidden;

        }


        /* =====================================================
           HEADER
        ====================================================== */

        .header {

            padding:
                calc(12px + env(safe-area-inset-top))
                16px
                8px;

            text-align: center;

            font-size: 20px;

            font-weight: bold;

        }


        .sub {

            text-align: center;

            color: #aaa;

            font-size: 13px;

            margin-bottom: 10px;

        }


        /* =====================================================
           SCANNER
        ====================================================== */

        .scanner {

            position: relative;

            flex: 1;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            background: #000;

        }


        video {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        /* =====================================================
           SCAN FRAME
        ====================================================== */

        .scan-frame {

            position: absolute;

            width: 72vw;

            max-width: 320px;

            height: 72vw;

            max-height: 320px;

            border: 3px solid #00ff88;

            border-radius: 20px;

            box-shadow:
                0 0 0 9999px
                rgba(0, 0, 0, 0.45);

            pointer-events: none;

        }


        .scan-line {

            position: absolute;

            left: 8px;

            right: 8px;

            top: 10%;

            height: 2px;

            background: #00ff88;

            box-shadow:
                0 0 10px #00ff88;

            animation:
                scan 2s infinite;

        }


        @keyframes scan {

            0% {
                top: 10%;
            }

            50% {
                top: 88%;
            }

            100% {
                top: 10%;
            }

        }


        /* =====================================================
           STATUS
        ====================================================== */

        .status {

            padding: 14px;

            text-align: center;

            background: #181818;

            font-size: 14px;

            min-height: 48px;

        }


        .error {

            color: #ff6b6b;

        }


        /* =====================================================
           RESULT
        ====================================================== */

        .result {

            display: none;

            padding: 16px;

            background: #181818;

        }


        .result-title {

            color: #00ff88;

            font-weight: bold;

            margin-bottom: 8px;

        }


        .result-value {

            word-break: break-all;

            background: #252525;

            border-radius: 10px;

            padding: 12px;

            font-size: 15px;

        }


        /* =====================================================
           BUTTON
        ====================================================== */

        button {

            margin-top: 12px;

            width: 100%;

            padding: 13px;

            border: 0;

            border-radius: 10px;

            font-size: 15px;

            font-weight: bold;

            background: #00a86b;

            color: white;

            cursor: pointer;

        }


        button:active {

            transform: scale(0.98);

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        📷 CloudMES Scanner

    </div>


    <div class="sub">

        QR Code / Data Matrix

    </div>


    <!-- =====================================================
         CAMERA
    ====================================================== -->

    <div
        id="scanner"
        class="scanner"
    >

        <video
            id="video"
            autoplay
            muted
            playsinline
        ></video>


        <div class="scan-frame">

            <div class="scan-line"></div>

        </div>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div
        id="status"
        class="status"
    >

        🔍 Đang khởi động camera...

    </div>


    <!-- =====================================================
         RESULT
    ====================================================== -->

    <div
        id="result"
        class="result"
    >

        <div class="result-title">

            ✅ Đã quét được

        </div>


        <div
            id="resultValue"
            class="result-value"
        ></div>


        <button
            id="rescan"
            type="button"
        >

            🔄 Quét lại

        </button>

    </div>


<script>

"use strict";


/* =========================================================
   TELEGRAM
========================================================= */

const tg =
    window.Telegram &&
    window.Telegram.WebApp;


if (tg) {

    tg.ready();

    tg.expand();

}


/* =========================================================
   DOM
========================================================= */

const video =
    document.getElementById(
        "video"
    );


const statusEl =
    document.getElementById(
        "status"
    );


const resultEl =
    document.getElementById(
        "result"
    );


const resultValueEl =
    document.getElementById(
        "resultValue"
    );


const scannerEl =
    document.getElementById(
        "scanner"
    );


const rescanBtn =
    document.getElementById(
        "rescan"
    );


/* =========================================================
   VARIABLES
========================================================= */

let codeReader =
    null;


let controls =
    null;


let sent =
    false;


let scanning =
    false;


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    error = false
) {

    statusEl.textContent =
        text;


    statusEl.classList.toggle(
        "error",
        error
    );

}


/* =========================================================
   CHECK ZXING
========================================================= */

function checkZXing() {

    if (
        typeof ZXingBrowser ===
        "undefined"
    ) {

        console.error(
            "[CloudMES Scanner] ZXingBrowser NOT FOUND"
        );


        setStatus(
            "❌ Không tải được thư viện ZXing.",
            true
        );


        return false;

    }


    console.log(
        "[CloudMES Scanner] ZXingBrowser OK"
    );


    return true;

}


/* =========================================================
   STOP CAMERA
========================================================= */

function stopScanner() {

    scanning =
        false;


    if (controls) {

        try {

            controls.stop();

        }
        catch (error) {

            console.warn(
                "[CloudMES Scanner] Stop error:",
                error
            );

        }


        controls =
            null;

    }


    /*
     * Dừng toàn bộ camera stream
     */

    if (
        video.srcObject
    ) {

        try {

            const tracks =
                video
                    .srcObject
                    .getTracks();


            tracks.forEach(
                track => {

                    try {

                        track.stop();

                    }
                    catch (e) {}

                }
            );

        }
        catch (error) {

            console.warn(
                "[CloudMES Scanner] Camera stop error:",
                error
            );

        }


        video.srcObject =
            null;

    }

}


/* =========================================================
   FIND BACK CAMERA
========================================================= */

async function getCameraDevice() {

    const devices =
        await ZXingBrowser
            .BrowserCodeReader
            .listVideoInputDevices();


    if (
        !devices ||
        devices.length === 0
    ) {

        throw new Error(
            "Không tìm thấy camera"
        );

    }


    console.log(
        "[CloudMES Scanner] Cameras:",
        devices
    );


    /*
     * Ưu tiên camera sau
     */

    const backCamera =
        devices.find(
            device => {

                const label =
                    String(
                        device.label ||
                        ""
                    ).toLowerCase();


                return (
                    label.includes("back") ||
                    label.includes("rear") ||
                    label.includes("environment") ||
                    label.includes("trailing")
                );

            }
        );


    if (backCamera) {

        return backCamera.deviceId;

    }


    /*
     * Nếu chưa có label
     * dùng camera cuối cùng
     */

    return (
        devices[
            devices.length - 1
        ].deviceId
    );

}


/* =========================================================
   START SCANNER
========================================================= */

async function startScanner() {

    sent =
        false;


    resultEl.style.display =
        "none";


    scannerEl.style.display =
        "flex";


    setStatus(
        "🔍 Đang mở camera..."
    );


    if (
        !checkZXing()
    ) {

        return;

    }


    try {

        /*
         * Tạo ZXing reader
         */

        codeReader =
            new ZXingBrowser
                .BrowserMultiFormatReader();


        /*
         * Tìm camera
         */

        const deviceId =
            await getCameraDevice();


        setStatus(
            "🔍 Đưa QR / Data Matrix vào khung..."
        );


        /*
         * Bắt đầu decode
         *
         * BrowserMultiFormatReader hỗ trợ
         * nhiều loại barcode, gồm QR và Data Matrix.
         */

        controls =
            await codeReader
                .decodeFromVideoDevice(

                    deviceId,

                    video,

                    (
                        result,
                        error
                    ) => {

                        /*
                         * Có kết quả
                         */

                        if (
                            result &&
                            !sent
                        ) {

                            const value =
                                result.getText();


                            handleScan(
                                value
                            );

                        }

                    }

                );


        scanning =
            true;


        console.log(
            "[CloudMES Scanner] Camera started"
        );

    }
    catch (error) {

        console.error(
            "[CloudMES Scanner] Camera ERROR:",
            error
        );


        let message =
            error?.message ||
            String(error);


        /*
         * Camera permission
         */

        if (
            error?.name ===
            "NotAllowedError"
        ) {

            message =
                "Camera bị từ chối quyền truy cập.";

        }


        /*
         * Không tìm thấy camera
         */

        if (
            error?.name ===
            "NotFoundError"
        ) {

            message =
                "Không tìm thấy camera.";

        }


        setStatus(
            "❌ Không mở được camera: " +
            message,
            true
        );

    }

}


/* =========================================================
   HANDLE SCAN
========================================================= */

function handleScan(
    value
) {

    if (
        sent ||
        !value
    ) {

        return;

    }


    value =
        String(
            value
        ).trim();


    if (!value) {

        return;

    }


    sent =
        true;


    console.log(
        "[CloudMES Scanner] SCAN:",
        value
    );


    setStatus(
        "✅ Đã quét thành công"
    );


    resultValueEl.textContent =
        value;


    scannerEl.style.display =
        "none";


    resultEl.style.display =
        "block";


    /*
     * Dừng camera
     */

    stopScanner();


    /*
     * Gửi dữ liệu về Telegram
     */

    if (!tg) {

        setStatus(
            "❌ Telegram WebApp không khả dụng.",
            true
        );

        return;

    }


    try {

        tg.sendData(

            JSON.stringify({

                type:
                    "scan",

                value:
                    value

            })

        );


        console.log(
            "[CloudMES Scanner] Data sent to Telegram"
        );

    }
    catch (error) {

        console.error(
            "[CloudMES Scanner] sendData ERROR:",
            error
        );


        setStatus(
            "❌ Không gửi được dữ liệu về Telegram.",
            true
        );

        sent =
            false;

    }

}


/* =========================================================
   RESCAN
========================================================= */

rescanBtn.addEventListener(
    "click",
    async () => {

        stopScanner();


        await startScanner();

    }
);


/* =========================================================
   PAGE HIDDEN
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            stopScanner();

        }

    }
);


/* =========================================================
   PAGE UNLOAD
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        stopScanner();

    }
);


/* =========================================================
   START
========================================================= */

(async function () {

    console.log(
        "======================================"
    );


    console.log(
        "[CloudMES Scanner] START"
    );


    console.log(
        "ZXingBrowser:",
        typeof ZXingBrowser
    );


    console.log(
        "Telegram WebApp:",
        typeof Telegram
    );


    console.log(
        "======================================"
    );


    if (
        !checkZXing()
    ) {

        return;

    }


    if (!tg) {

        setStatus(
            "❌ Không chạy trong Telegram WebApp.",
            true
        );

        return;

    }


    await startScanner();

})();

</script>

</body>

</html>
```
